name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run catalog:validate
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --prefix functions --omit=dev --audit-level=high
